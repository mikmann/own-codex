name: extended-workflow-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: extended-workflow-release
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require tag and Cargo version to match
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] || { echo "Expected a tag ref" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\([^"]*\)"/\1/p' codex-rs/Cargo.toml | head -n1)"
          [[ -n "$cargo_version" && "$version" == "$cargo_version" ]] || {
            echo "Tag version '$version' does not match Cargo version '$cargo_version'" >&2
            exit 1
          }
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Test package builder
        run: python3 -m unittest discover -s scripts/codex_package -p 'test_*.py'

  build-and-gate-windows:
    name: Build and gate Windows x64 package
    needs: validate-tag
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RELEASE_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.RELEASE_TARGET }}
      - name: Configure rusty_v8 artifact overrides
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ env.RELEASE_TARGET }}
      - name: Configure LLVM linker
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ env.RELEASE_TARGET }}

      - name: Build matching release binaries
        shell: pwsh
        run: |
          $env:LIBSQLITE3_FLAGS = "SQLITE_DISABLE_INTRINSIC"
          cargo build `
            --manifest-path codex-rs/Cargo.toml `
            --target $env:RELEASE_TARGET `
            --release `
            --bin codex-extended-workflow `
            --bin codex-code-mode-host `
            --bin codex-command-runner `
            --bin codex-windows-sandbox-setup

      - name: Build package and checksum manifest
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:CARGO_TARGET_DIR "$env:RELEASE_TARGET\release"
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist\extended-workflow"
          $packageDir = Join-Path $env:RUNNER_TEMP "codex-extended-workflow-package"
          $archiveName = "codex-extended-workflow-package-$env:RELEASE_TARGET.zip"
          $archivePath = Join-Path $distDir $archiveName
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          python scripts/build_codex_package.py `
            --target $env:RELEASE_TARGET `
            --variant codex-extended-workflow `
            --cargo-profile release `
            --package-dir $packageDir `
            --archive-output $archivePath `
            --entrypoint-bin (Join-Path $releaseDir "codex-extended-workflow.exe") `
            --code-mode-host-bin (Join-Path $releaseDir "codex-code-mode-host.exe") `
            --codex-command-runner-bin (Join-Path $releaseDir "codex-command-runner.exe") `
            --codex-windows-sandbox-setup-bin (Join-Path $releaseDir "codex-windows-sandbox-setup.exe") `
            --force

          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          $manifest = Join-Path $distDir "codex-extended-workflow-package_SHA256SUMS"
          Set-Content -LiteralPath $manifest -Value "$digest  $archiveName" -Encoding utf8
          Copy-Item scripts/install/install-extended-workflow.ps1 $distDir

      - name: Install and smoke-test the packaged release
        shell: pwsh
        run: |
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist\extended-workflow"
          $archive = Join-Path $distDir "codex-extended-workflow-package-$env:RELEASE_TARGET.zip"
          $manifest = Join-Path $distDir "codex-extended-workflow-package_SHA256SUMS"
          $installRoot = Join-Path $env:RUNNER_TEMP "installed-extended-workflow"
          & scripts/install/install-extended-workflow.ps1 `
            -ArchivePath $archive `
            -ChecksumPath $manifest `
            -InstallRoot $installRoot `
            -NoPathUpdate `
            -Confirm:$false
          & (Join-Path $installRoot "bin\codex-extended-workflow.exe") --version
          & (Join-Path $installRoot "bin\codex-code-mode-host.exe") --help

      - name: Upload gated release assets
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-extended-workflow-windows-x64
          path: dist/extended-workflow/*
          if-no-files-found: error

  publish-release:
    name: Publish gated GitHub release
    needs:
      - validate-tag
      - build-and-gate-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download gated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-extended-workflow-windows-x64
          path: dist
      - name: Publish release only after all gates pass
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.validate-tag.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: ${{ !contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
